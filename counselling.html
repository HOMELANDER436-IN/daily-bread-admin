<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Daily Bread — Counselling Requests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Malayalam:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <!-- Mobile & PWA -->
  <meta name="theme-color" content="#2E4A3E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <!-- Detail Panel -->
  <div class="slide-panel-backdrop" id="detail-backdrop" onclick="window.closeDetail()"></div>
  <div class="slide-panel" id="detail-panel" role="dialog" aria-modal="true" aria-label="Counselling request detail">
    <!-- Rendered by JS -->
  </div>

  <div class="admin-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">🍞 <span data-i18n="appName">Daily Bread</span> <span class="sidebar-badge" data-i18n="adminBadge">Admin</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html"><span class="nav-icon">📊</span> <span data-i18n="dashboard">Dashboard</span></a>
        <a href="messages.html"><span class="nav-icon">📖</span> <span data-i18n="messages">Messages</span></a>
        <a href="counselling.html" class="active"><span class="nav-icon">🕊️</span> <span data-i18n="counsellingRequests">Counselling Requests</span><span class="nav-badge" id="counselling-badge" style="display:none"></span></a>
        <a href="prayer.html"><span class="nav-icon">🙏</span> <span data-i18n="prayerSettings">Prayer Settings</span></a>
        <div class="nav-divider"></div>
        <a href="#" onclick="window.switchLanguage('en');return false;"><span class="nav-icon">🌐</span> English</a>
        <a href="#" onclick="window.switchLanguage('ml');return false;"><span class="nav-icon">🌐</span> മലയാളം</a>
      </nav>
    </aside>

    <div class="main-content">
      <header class="top-header">
        <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
        <h1 data-i18n="counsellingRequests">Counselling Requests</h1>
        <div></div>
      </header>

      <div class="page-body">
        <!-- Filter Tabs -->
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all" data-i18n="all">All</button>
          <button class="filter-tab" data-filter="unread" data-i18n="unread">Unread</button>
          <button class="filter-tab" data-filter="viewed" data-i18n="viewed">Viewed</button>
        </div>

        <!-- List -->
        <div class="card">
          <ul class="counselling-list" id="counselling-list">
            <li style="padding:20px;text-align:center;color:var(--text-muted)">Loading...</li>
          </ul>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/counselling.js"></script>
</body>
</html>
